name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install SDK/NDK components
        run: yes | sdkmanager "ndk;26.3.11579264" "build-tools;35.0.0" "platform-tools"
      - name: Build unsigned APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          ./scripts/build-linux.sh
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.POCKETNAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocketnas-release.jks"
      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.POCKETNAS_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.POCKETNAS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETNAS_KEY_ALIAS }}
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/pocketnas-release.jks" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --out dist/PocketNAS-v2.4-arm64.apk \
            build/PocketNAS-v2.4-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/PocketNAS-v2.4-arm64.apk
          sha256sum dist/PocketNAS-v2.4-arm64.apk > dist/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/PocketNAS-v2.4-arm64.apk dist/SHA256SUMS.txt \
            --title "PocketNAS $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
