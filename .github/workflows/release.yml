name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v3.1.0-beta.1'
        required: true
        default: 'v3.1.0-beta.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ready-to-use assets
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/PocketNAS-v3.1-arm64.apk \
              release/PocketNAS-Drive-Setup-v3.1.exe \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/PocketNAS-v3.1-arm64.apk \
              release/PocketNAS-Drive-Setup-v3.1.exe \
              release/SHA256SUMS.txt \
              --target main \
              --title "PocketNAS v3.1.0 Beta 1" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
