name: Build Streamflix TV APK

on:
  push:
    branches:
      - chatgpt-streamflix-apk-build
    paths:
      - "streamflix-package20/**"
      - ".github/workflows/build-streamflix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct Streamflix source package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path("streamflix-package20").glob("part*.hex"))
          if len(parts) != 5:
              raise SystemExit(f"Expected 5 source chunks, found {len(parts)}")
          data = bytes.fromhex("".join(p.read_text().strip() for p in parts))
          Path("/tmp/streamflix-source.zip").write_bytes(data)
          print(f"Reconstructed {len(data)} bytes from {len(parts)} chunks")
          PY
          rm -rf /tmp/streamflix-src
          mkdir -p /tmp/streamflix-src
          unzip -q /tmp/streamflix-source.zip -d /tmp/streamflix-src
          test -f /tmp/streamflix-src/StreamflixTV-2.0.0-rebuild/settings.gradle.kts
          echo "Source reconstruction OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build APK
        working-directory: /tmp/streamflix-src/StreamflixTV-2.0.0-rebuild
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK="/tmp/streamflix-src/StreamflixTV-2.0.0-rebuild/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Streamflix-TV-v2.0.0-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/Streamflix-TV-v2.0.0-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/Streamflix-TV-v2.0.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamflix-TV-v2.0.0-debug
          path: Streamflix-TV-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 7
