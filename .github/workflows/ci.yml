name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax checks
        run: python -m py_compile tools/*.py
      - name: Verify required public assets are present
        run: |
          test -f release/PocketNAS-v3.1-arm64.apk
          test -f release/PocketNAS-Drive-Setup-v3.1.exe
          test -f release/SHA256SUMS.txt
          test -f assets/pocketnas-icon.png
          test -f assets/pocketnas-icon.ico
      - name: Verify published checksums
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
