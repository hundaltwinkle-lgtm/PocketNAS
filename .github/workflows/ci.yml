name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: yes | sdkmanager "ndk;26.3.11579264" "build-tools;35.0.0" "platform-tools"
      - name: Build unsigned APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          ./scripts/build-linux.sh
      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketNAS-unsigned-ci
          path: build/PocketNAS-v2.4-unsigned.apk
