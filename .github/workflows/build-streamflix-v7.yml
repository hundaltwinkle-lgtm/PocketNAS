name: Build Streamflix TV APK v7

on:
  push:
    branches: [chatgpt-streamflix-apk-build]
    paths:
      - "streamflix-package20/**"
      - ".github/workflows/build-streamflix-v7.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path("streamflix-package20").glob("part*.hex"))
          if len(parts) != 5:
              raise SystemExit(f"Expected 5 chunks, got {len(parts)}")
          Path("/tmp/streamflix-source.zip").write_bytes(
              bytes.fromhex("".join(p.read_text().strip() for p in parts))
          )
          PY
          rm -rf /tmp/streamflix-src
          mkdir -p /tmp/streamflix-src
          unzip -q /tmp/streamflix-source.zip -d /tmp/streamflix-src

      - name: Patch AGP 9 Kotlin DSL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/streamflix-src/StreamflixTV-2.0.0-rebuild")
          app = root / "app/build.gradle.kts"
          top = root / "build.gradle.kts"

          s = app.read_text()
          s = s.replace('id("org.jetbrains.kotlin.android")', '')
          s = re.sub(r'\n\s*kotlinOptions\s*\{.*?\n\s*\}\s*\n', '\n', s, flags=re.S)
          app.write_text(s)

          t = top.read_text()
          t = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n', '', t, flags=re.M)
          top.write_text(t)

          if "kotlinOptions" in app.read_text():
              raise SystemExit("kotlinOptions patch failed")
          print("AGP 9 patch OK")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37 preview
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-37|build-tools;37" || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Compile
        working-directory: /tmp/streamflix-src/StreamflixTV-2.0.0-rebuild
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          SRC=/tmp/streamflix-src/StreamflixTV-2.0.0-rebuild/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC"
          cp "$SRC" Streamflix-TV-v2.0.0-debug.apk
          sha256sum Streamflix-TV-v2.0.0-debug.apk
          ls -lh Streamflix-TV-v2.0.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Streamflix-TV-v2.0.0-debug
          path: Streamflix-TV-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 7
