name: Build Streamflix TV APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ chatgpt-streamflix-apk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Streamflix source
        shell: bash
        run: |
          cat streamflix-build/src.b64.part* | base64 -d > /tmp/streamflix-src.zip
          unzip -q /tmp/streamflix-src.zip -d /tmp/streamflix
          test -f /tmp/streamflix/StreamflixTV-2.1.0-rebuild/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/streamflix/StreamflixTV-2.1.0-rebuild/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: /tmp/streamflix/StreamflixTV-2.1.0-rebuild
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamflix-TV-2.1.0-debug
          path: /tmp/streamflix/StreamflixTV-2.1.0-rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
