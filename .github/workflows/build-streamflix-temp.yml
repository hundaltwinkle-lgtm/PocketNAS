name: Build Streamflix TV APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ chatgpt-streamflix-apk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Streamflix source
        shell: bash
        run: |
          cat streamflix-build/src.b64.part* | base64 -d > /tmp/streamflix-src.zip
          unzip -q /tmp/streamflix-src.zip -d /tmp/streamflix
          test -f /tmp/streamflix/StreamflixTV-2.1.0-rebuild/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: /tmp/streamflix/StreamflixTV-2.1.0-rebuild
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamflix-TV-2.1.0-debug
          path: /tmp/streamflix/StreamflixTV-2.1.0-rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
